spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/arcane_academy}
    username: ${SPRING_DATASOURCE_USERNAME:arcane}
    password: ${SPRING_DATASOURCE_PASSWORD:arcane_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:dev_secret_change_in_production_min32}
  expiration-ms: 86400000  # 24 hours

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  api-url: https://api.anthropic.com/v1/messages
  model: claude-sonnet-4-20250514

cors:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    com.arcane: DEBUG
    org.springframework.security: INFO
