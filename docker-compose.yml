services:
  db:
    image: postgres:16-alpine
    pull_policy: missing
    container_name: arcane-db
    environment:
      POSTGRES_DB: arcane_academy
      POSTGRES_USER: arcane
      POSTGRES_PASSWORD: arcane_secret
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arcane -d arcane_academy"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: arcane-backend
    env_file: .env                          # loads JWT_SECRET, STRIPE_*, GOOGLE_*, ANTHROPIC_API_KEY, etc.
    environment:
      # These inline values take precedence over .env — they point to the Docker db service
      # and set localhost-correct URLs so OAuth and CORS work locally.
      SPRING_PROFILES_ACTIVE: stage
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/arcane_academy
      SPRING_DATASOURCE_USERNAME: arcane
      SPRING_DATASOURCE_PASSWORD: arcane_secret
      ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://localhost:5173
      OAUTH2_FRONTEND_REDIRECT: http://localhost:5173/oauth2/callback
      FRONTEND_URL: http://localhost
      HTTPS_REQUIRED: "false"
      SENTRY_DSN: ""
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: arcane-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pg_data:
