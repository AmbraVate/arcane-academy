spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/arcane_academy}
    username: ${SPRING_DATASOURCE_USERNAME:arcane}
    password: ${SPRING_DATASOURCE_PASSWORD:arcane_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Tuned for serverless Postgres (Neon): recycle connections well before any
      # upstream idle cap, and keep them warm with a periodic keepalive ping.
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      validation-timeout: 5000
      keepalive-time: 60000      # must be >= 30000 or HikariCP disables it
      idle-timeout: 60000        # must be < max-lifetime or HikariCP disables it
      max-lifetime: 180000
  jpa:
    hibernate:
      # 'update' in dev so Hibernate still auto-creates tables during local iteration.
      # Switch to 'validate' in prod once Flyway migrations are applied (set SPRING_JPA_DDL_AUTO=validate).
      ddl-auto: ${SPRING_JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    # Disabled in dev — Hibernate ddl-auto:update manages the schema locally.
    # Enable in prod: set FLYWAY_ENABLED=true and SPRING_JPA_DDL_AUTO=validate.
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 7
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-configured}
            scope: openid, email, profile

server:
  port: 8080

jwt:
  # No default — must be explicitly set via JWT_SECRET env var (min 64 chars recommended).
  secret: ${JWT_SECRET:default-secret}
  expiration-ms: 86400000  # 24 hours

app:
  oauth2:
    redirect-uri: ${OAUTH2_FRONTEND_REDIRECT:http://localhost:5173/oauth2/callback}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

# Stripe — payment processing.
# Set all values via environment variables in production.
# Create products + prices in your Stripe dashboard and paste the Price IDs below.
# Use test keys (sk_test_...) during development; switch to live keys (sk_live_...) in prod.
stripe:
  # No defaults — all Stripe keys must be set via environment variables.
  # Use sk_test_... / whsec_... locally via .env; live keys only in cloud-run.env.yaml.
  secret-key: ${STRIPE_SECRET_KEY}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}
  price-id-monthly: ${STRIPE_PRICE_ID_MONTHLY:price_1TbiUQ8LtlZA9QG9YIzWvFWi}
  price-id-annual:  ${STRIPE_PRICE_ID_ANNUAL:price_1TbiXw8LtlZA9QG97qNpidXT}
  price-id-lifetime: ${STRIPE_PRICE_ID_LIFETIME:price_1Tbj8l8LtlZA9QG9AR6lU2zP}

# Anthropic — AiMentorService uses Claude Haiku 4.5 with prompt caching.
# Set ANTHROPIC_API_KEY to enable live AI responses; leave blank or "disabled" to use static responses only.
anthropic:
  api-key: ${ANTHROPIC_API_KEY:disabled}

cors:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}

https:
  required: ${HTTPS_REQUIRED:false}

management:
  endpoints:
    web:
      exposure:
        # /actuator/health is public via SecurityConfig; /actuator/prometheus is
        # scraped internally by Prometheus. If exposing prometheus to the public
        # internet, add an auth filter to SecurityConfig.
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: arcane-academy
  prometheus:
    metrics:
      export:
        enabled: true

# Telemetry config — see TelemetryService.
# In prod, set TELEMETRY_HASH_SALT to a long random string (≥32 chars) so user
# IDs in logs cannot be rainbow-tabled back to the underlying UUIDs.
telemetry:
  hash-salt: ${TELEMETRY_HASH_SALT:dev-salt-rotate-in-production}

# Sentry — error & performance monitoring.
#  • dsn empty → starter auto-disables, no network calls. Safe default for dev.
#  • environment → tags every event so prod/dev can be filtered server-side.
#  • traces-sample-rate → 0.0 in dev (no perf overhead); set 0.1–0.2 in prod.
#  • send-default-pii: false → never auto-attach IPs, cookies, headers (privacy).
#  • PII in events requires explicit scope.setUser(...) — we never call it.
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:dev}
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.0}
  send-default-pii: false
  in-app-includes:
    - com.ambravate.arcane.academy
  exception-resolver-order: -2147483647   # before Spring's default handler
  logging:
    minimum-event-level: error
    minimum-breadcrumb-level: info

# Rate limiting — token-bucket caps via Bucket4j. See RateLimitFilter.
# Caps are per identifier (IP for unauthenticated routes, userId for the rest).
# Set ratelimit.enabled=false to disable everything (e.g. local load testing).
ratelimit:
  enabled: ${RATELIMIT_ENABLED:true}
  auth:
    capacity: ${RATELIMIT_AUTH_CAPACITY:10}
    refill-tokens: ${RATELIMIT_AUTH_REFILL:10}
    refill-period-seconds: ${RATELIMIT_AUTH_PERIOD:60}
  ai-mentor:
    capacity: ${RATELIMIT_AI_CAPACITY:10}
    refill-tokens: ${RATELIMIT_AI_REFILL:10}
    refill-period-seconds: ${RATELIMIT_AI_PERIOD:60}
  code-runner:
    capacity: ${RATELIMIT_CODE_CAPACITY:30}
    refill-tokens: ${RATELIMIT_CODE_REFILL:30}
    refill-period-seconds: ${RATELIMIT_CODE_PERIOD:60}
  admin:
    capacity: ${RATELIMIT_ADMIN_CAPACITY:30}
    refill-tokens: ${RATELIMIT_ADMIN_REFILL:30}
    refill-period-seconds: ${RATELIMIT_ADMIN_PERIOD:60}

logging:
  level:
    root: INFO
    com.arcane.academy: DEBUG
    com.arcane.academy.runner.com.ambravate.arcane.academy.runner.JavaCodeRunner: DEBUG
    com.arcane.academy.service.com.ambravate.arcane.academy.service.QuestService: DEBUG
    com.arcane.academy.service.com.ambravate.arcane.academy.service.BossService: DEBUG
    com.arcane.academy.service.com.ambravate.arcane.academy.service.AuthService: DEBUG
    com.arcane.academy.service.com.ambravate.arcane.academy.service.StreakService: DEBUG
    com.arcane.academy.service.com.ambravate.arcane.academy.service.AiMentorService: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: logs/arcane-academy.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      file-name-pattern: logs/arcane-academy.%d{yyyy-MM-dd}.%i.log

