spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/arcane_academy}
    username: ${SPRING_DATASOURCE_USERNAME:arcane}
    password: ${SPRING_DATASOURCE_PASSWORD:arcane_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:dev_secret_change_in_production_min32}
  expiration-ms: 86400000  # 24 hours

# Anthropic config kept for reference but AiMentorService no longer makes API calls
anthropic:
  api-key: ${ANTHROPIC_API_KEY:disabled}
  api-url: https://api.anthropic.com/v1/messages
  model: claude-sonnet-4-20250514

cors:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    root: INFO
    com.arcane.academy: DEBUG
    com.arcane.academy.runner.JavaCodeRunner: DEBUG
    com.arcane.academy.service.QuestService: DEBUG
    com.arcane.academy.service.BossService: DEBUG
    com.arcane.academy.service.AuthService: DEBUG
    com.arcane.academy.service.StreakService: DEBUG
    com.arcane.academy.service.AiMentorService: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: logs/arcane-academy.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      file-name-pattern: logs/arcane-academy.%d{yyyy-MM-dd}.%i.log
