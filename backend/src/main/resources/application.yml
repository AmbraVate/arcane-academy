spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/polymath_academy}
    username: ${SPRING_DATASOURCE_USERNAME:polymath}
    password: ${SPRING_DATASOURCE_PASSWORD:polymath_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-configured}
            scope: openid, email, profile

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:dev_secret_change_in_production_min32}
  expiration-ms: 86400000  # 24 hours

app:
  oauth2:
    redirect-uri: ${OAUTH2_FRONTEND_REDIRECT:http://localhost:5173/oauth2/callback}

# Anthropic config kept for reference but AiMentorService no longer makes API calls
anthropic:
  api-key: ${ANTHROPIC_API_KEY:disabled}
  api-url: https://api.anthropic.com/v1/messages
  model: claude-sonnet-4-20250514

cors:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        # /actuator/health is public via SecurityConfig; /actuator/prometheus is
        # scraped internally by Prometheus. If exposing prometheus to the public
        # internet, add an auth filter to SecurityConfig.
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: polymath-academy
  prometheus:
    metrics:
      export:
        enabled: true

# Telemetry config — see TelemetryService.
# In prod, set TELEMETRY_HASH_SALT to a long random string (≥32 chars) so user
# IDs in logs cannot be rainbow-tabled back to the underlying UUIDs.
telemetry:
  hash-salt: ${TELEMETRY_HASH_SALT:dev-salt-rotate-in-production}

logging:
  level:
    root: INFO
    com.arcane.academy: DEBUG
    com.arcane.academy.runner.com.ambravate.polymath.academy.runner.JavaCodeRunner: DEBUG
    com.arcane.academy.service.com.ambravate.polymath.academy.service.QuestService: DEBUG
    com.arcane.academy.service.com.ambravate.polymath.academy.service.BossService: DEBUG
    com.arcane.academy.service.com.ambravate.polymath.academy.service.AuthService: DEBUG
    com.arcane.academy.service.com.ambravate.polymath.academy.service.StreakService: DEBUG
    com.arcane.academy.service.com.ambravate.polymath.academy.service.AiMentorService: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: logs/polymath-academy.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      file-name-pattern: logs/polymath-academy.%d{yyyy-MM-dd}.%i.log
