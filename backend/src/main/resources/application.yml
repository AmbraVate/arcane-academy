spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pollymath_academy}
    username: ${SPRING_DATASOURCE_USERNAME:pollymath}
    password: ${SPRING_DATASOURCE_PASSWORD:pollymath_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-configured}
            scope: openid, email, profile

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:dev_secret_change_in_production_min32}
  expiration-ms: 86400000  # 24 hours

app:
  oauth2:
    redirect-uri: ${OAUTH2_FRONTEND_REDIRECT:http://localhost:5173/oauth2/callback}

# Anthropic config kept for reference but AiMentorService no longer makes API calls
anthropic:
  api-key: ${ANTHROPIC_API_KEY:disabled}
  api-url: https://api.anthropic.com/v1/messages
  model: claude-sonnet-4-20250514

cors:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.arcane.academy: DEBUG
    com.arcane.academy.runner.JavaCodeRunner: DEBUG
    com.arcane.academy.service.QuestService: DEBUG
    com.arcane.academy.service.BossService: DEBUG
    com.arcane.academy.service.AuthService: DEBUG
    com.arcane.academy.service.StreakService: DEBUG
    com.arcane.academy.service.AiMentorService: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: logs/pollymath-academy.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      file-name-pattern: logs/pollymath-academy.%d{yyyy-MM-dd}.%i.log
