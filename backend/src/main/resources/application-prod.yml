spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    root: WARN
    com.arcane.academy: INFO
    com.arcane.academy.runner.com.ambravate.arcane.academy.runner.JavaCodeRunner: INFO
    com.arcane.academy.service: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.hibernate.SQL: WARN

# Production overrides for Sentry — sample 10% of traces, tag environment.
# DSN MUST come from env (SENTRY_DSN); leaving the application.yml default ('')
# means prod boots cleanly even if the env var is forgotten — Sentry just stays
# silent rather than spamming a malformed-DSN exception on startup.
https:
  required: true

sentry:
  environment: ${SENTRY_ENVIRONMENT:prod}
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.1}
