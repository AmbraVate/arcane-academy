# Arcane Academy CI — runs on every push and PR.
#
# Two parallel jobs (backend Java/Maven, frontend Node/Vitest) so a flaky test
# in one half never blocks the other half's signal. Both must pass before merge.
#
# Lock-step versions: backend pinned at Java 21 (matches pom.xml), frontend at
# Node 20 (LTS at time of writing). Bump together when upgrading.
name: CI

on:
  push:
    branches: [master, main, "rewrite-java-syllabus"]
  pull_request:
    branches: [master, main]

# Cancel previous runs of the same branch when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21 / Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Compile + tests. -B = batch mode (no progress chatter in logs).
      # Tests are skipped today because §13 in CLAUDE.md notes the test scaffolding
      # is in progress; remove -DskipTests once the suite is stable.
      - name: Maven verify
        working-directory: backend
        run: mvn -B -DskipTests verify

      # Flyway dry-run gate referenced in CLAUDE.md §13. Currently a no-op
      # because we use `ddl-auto: update` in dev — wire this once Flyway
      # migrations actually exist under backend/src/main/resources/db/migration.
      # Left as a placeholder so the next person sees where to plug it in.
      # - name: Flyway migration dry-run
      #   working-directory: backend
      #   run: mvn -B -Pflyway-validate flyway:validate

  frontend:
    name: Frontend (Node 20 / Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      # Accessibility smoke tests — jest-axe inside jsdom. Catches ~60-70% of
      # WCAG AA semantic issues (alt text, ARIA, headings, labels) and runs
      # in <2s. Visual rules (contrast, focus indicators) need a real browser
      # — pair with @axe-core/playwright once Playwright is wired up.
      - name: Accessibility tests
        run: npm run test:a11y

      # Production build sanity — catches Vite bundler errors (missing imports,
      # circular deps surfaced only at build time) that escape `tsc --noEmit`.
      - name: Build
        run: npm run build
