[build]
base    = "frontend"
publish = "dist"
command = "npm install && npm run build"

[build.environment]
NODE_VERSION = "20"

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
X-Frame-Options        = "DENY"
Referrer-Policy        = "strict-origin-when-cross-origin"

# API proxy — routes /api/*, /oauth2/*, /login/oauth2/* to the Koyeb backend
[[redirects]]
from  = "/api/*"
to    = "https://arcane-academy-api-270707674521.europe-west2.run.app/api/:splat"
status = 200
force  = true

[[redirects]]
from  = "/oauth2/*"
to    = "https://arcane-academy-api-270707674521.europe-west2.run.app/oauth2/:splat"
status = 200
force  = true

[[redirects]]
from  = "/login/oauth2/*"
to    = "https://arcane-academy-api-270707674521.europe-west2.run.app/login/oauth2/:splat"
status = 200
force  = true

# SPA fallback — must be last
[[redirects]]
from  = "/*"
to    = "/index.html"
status = 200